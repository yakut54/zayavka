name: ci

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Какие области затронул пуш (сравнение с предыдущим состоянием ветки).
  changes:
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ steps.f.outputs.api }}
      web: ${{ steps.f.outputs.web }}
      storybook: ${{ steps.f.outputs.storybook }}
      contract: ${{ steps.f.outputs.contract }}
      e2e: ${{ steps.f.outputs.e2e }}
      lighthouse: ${{ steps.f.outputs.lighthouse }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'scripts/uv.sh'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/site/**'
              - 'apps/admin/**'
              - 'apps/max-app/**'
              - 'packages/**'
              - 'docs/**'
              - '*.md'
              - '*.js'
              - '*.cjs'
              - 'package.json'
              - 'pnpm-*.yaml'
              - '.github/workflows/ci.yml'
            storybook:
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            contract:
              - 'apps/api/**'
              - 'infra/**'
              - 'scripts/contract.sh'
              - 'scripts/uv.sh'
              - '.github/workflows/ci.yml'
            e2e:
              - 'apps/**'
              - 'packages/**'
              - 'e2e/**'
              - 'infra/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            lighthouse:
              - 'apps/site/**'
              - 'apps/admin/**'
              - 'apps/api/**'
              - 'packages/**'
              - 'infra/**'
              - 'lighthouserc.cjs'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict app
      - run: uv run pytest --cov=app --cov-fail-under=90
      - run: uv run pip-audit

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    env:
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: typecheck и тесты только изменённых пакетов и зависящих от них
        run: |
          BASE="$BEFORE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="HEAD~1"; fi
          pnpm -r --if-present --filter "...[$BASE]" typecheck
          pnpm -r --if-present --filter "...[$BASE]" test
      - run: pnpm i18n:check
      - run: pnpm --filter @app/site build && pnpm --filter @app/site budget
      - run: pnpm --filter @app/admin build
      - run: pnpm --filter @app/max-app build && pnpm --filter @app/max-app check-bundle
      - run: pnpm audit --prod

  storybook:
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @app/ui build-storybook
      - run: pnpm --filter @app/ui test-storybook:ci

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/site build && pnpm --filter @app/admin build
      - run: docker compose -p zayavka-test -f infra/compose.test.yml up -d --build --wait
      - run: docker compose -p zayavka-test -f infra/compose.test.yml exec -T api python -m app.cli create-admin --email contract@example.ru --stdin <<< 'contract-pass-123'
      - run: DOCKER_NETWORK=host API_URL_FROM_DOCKER=http://localhost:8080 API_URL=http://localhost:8080 bash scripts/contract.sh
      - if: always()
        run: docker compose -p zayavka-test -f infra/compose.test.yml down -v

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/e2e exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @app/site build && pnpm --filter @app/admin build
      - run: VITE_DEMO=true pnpm --filter @app/max-app build
      - run: docker compose -p zayavka-test -f infra/compose.test.yml up -d --build --wait
      - run: pnpm --filter @app/e2e run e2e
        env: { CI: 'true', E2E_WEBKIT: '1' }
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: e2e-report, path: "e2e/playwright-report\ne2e/test-results" }
      - if: always()
        run: docker compose -p zayavka-test -f infra/compose.test.yml down -v

  lighthouse:
    needs: changes
    if: needs.changes.outputs.lighthouse == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/site build && pnpm --filter @app/admin build
      - run: docker compose -p zayavka-test -f infra/compose.test.yml up -d --build --wait
      - run: pnpm exec lhci autorun
      - if: always()
        run: docker compose -p zayavka-test -f infra/compose.test.yml down -v

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
